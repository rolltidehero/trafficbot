services:
  traffic-bot:
    build: .
    # Chrome for Testing is provided for Linux amd64.
    platform: linux/amd64
    init: true
    cap_add: [SYS_ADMIN]
    shm_size: 1gb
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      BOT_ROLE: ${BOT_ROLE:-both}
      DEFAULT_URL: ${DEFAULT_URL:-http://127.0.0.1:8080/}
      REDIS_URL: redis://redis:6379
      SESSIONS_DATA_DIR: /app/sessions
      LOCAL_FALLBACK: 'false'
    volumes:
      - sessions:/app/sessions
      - logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
    restart: 'no'
    stop_grace_period: 40s
  redis:
    image: redis:7.4-alpine
    command: [redis-server, --appendonly, 'yes']
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 1s
      retries: 15
    restart: unless-stopped
  # Optional Tor proxy: explicit config; no management listener or credentials.
  tor-proxy:
    profiles: [tor]
    build:
      context: .
      dockerfile: docker/tor/Dockerfile
    volumes:
      - tor-data:/var/lib/tor
    restart: unless-stopped
volumes:
  sessions:
  logs:
  redis-data:
  tor-data:
